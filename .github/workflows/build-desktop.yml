name: Build marketing-harness Desktop

on:
  push:
    tags:
      - "marketing-harness-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish stable desktop-version.json release assets"
        required: true
        type: boolean
        default: false
      release_channel:
        description: "Release channel. Only stable can update marketing-harness-latest."
        required: true
        type: choice
        default: qa
        options:
          - qa
          - stable

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: read

concurrency:
  # Every stable run can update the same moving release, so serialize across
  # tags and manual dispatches instead of grouping by ref.
  group: marketing-harness-desktop-release
  cancel-in-progress: false

jobs:
  macos:
    name: macOS ${{ matrix.arch }} desktop artifacts
    runs-on: ${{ matrix.runner }}
    # Protect signing and notarization credentials with environment deployment
    # rules that only allow trusted release refs and reviewers.
    environment: desktop-release
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
        include:
          - arch: arm64
            host_arch: arm64
            runner: macos-15
          - arch: x64
            host_arch: x86_64
            runner: macos-15-intel
    outputs:
      has_signing_secrets: ${{ steps.signing.outputs.has_signing_secrets }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck desktop and launcher
        run: pnpm exec turbo run typecheck --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Build desktop
        run: pnpm exec turbo run build --filter=@bb/desktop --output-logs=new-only

      - name: Test desktop and launcher
        run: pnpm exec turbo run test --filter=@bb/desktop --filter=bb-app --force --output-logs=new-only

      - name: Validate macOS signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          REQUIRED_SECRET_NAMES=(
            "MACOS_CERTIFICATE_P12"
            "MACOS_CERTIFICATE_PASSWORD"
            "MACOS_CERTIFICATE_NAME"
            "APPLE_ID"
            "APPLE_APP_PASSWORD"
            "APPLE_TEAM_ID"
          )
          PRESENT_SECRET_NAMES=()
          MISSING_SECRET_NAMES=()

          for secret_name in "${REQUIRED_SECRET_NAMES[@]}"; do
            if [[ -n "${!secret_name:-}" ]]; then
              PRESENT_SECRET_NAMES+=("$secret_name")
            else
              MISSING_SECRET_NAMES+=("$secret_name")
            fi
          done

          HAS_SIGNING_SECRETS="false"
          if [[ "${#PRESENT_SECRET_NAMES[@]}" -eq 0 ]]; then
            echo "::warning::macOS signing/notarization secrets are not configured; building unsigned macOS workflow artifacts that a publish run will withhold. Both version feeds and the Linux AppImage still publish."
          elif [[ "${#MISSING_SECRET_NAMES[@]}" -eq 0 ]]; then
            echo "macOS signing/notarization secrets are complete; signed and notarized artifacts will be produced."
            HAS_SIGNING_SECRETS="true"
          else
            echo "::error::Incomplete macOS signing/notarization secret set. Present: ${PRESENT_SECRET_NAMES[*]}. Missing: ${MISSING_SECRET_NAMES[*]}."
            exit 1
          fi

          echo "has_signing_secrets=$HAS_SIGNING_SECRETS" >> "$GITHUB_OUTPUT"

      - name: Package ${{ matrix.arch }} desktop artifacts
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec turbo run desktop:build:mac:${{ matrix.arch }} --filter=@bb/desktop --output-logs=new-only

      - name: Smoke test packaged x64 desktop app
        if: matrix.arch == 'x64'
        run: pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only

      - name: Generate ${{ matrix.arch }} desktop version feed
        run: pnpm --dir apps/desktop run desktop:version-feed

      - name: Upload ${{ matrix.arch }} desktop workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-harness-desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/desktop-version.json
          if-no-files-found: error

  linux:
    name: Linux x64 desktop artifacts
    # Pinned rather than ubuntu-latest so the glibc the AppImage links against
    # changes only when we choose it: the build machine's glibc sets the
    # minimum distro version users need.
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck desktop and launcher
        run: pnpm exec turbo run typecheck --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Build desktop
        run: pnpm exec turbo run build --filter=@bb/desktop --output-logs=new-only

      - name: Test desktop and launcher
        run: pnpm exec turbo run test --filter=@bb/desktop --filter=bb-app --force --output-logs=new-only

      - name: Package x64 AppImage
        # No --force: the packaging task is already cache: false, and forcing also
        # rebuilds its cached bb-app/@bb/desktop dependencies a second time.
        run: pnpm exec turbo run desktop:build:linux --filter=@bb/desktop --output-logs=new-only

      - name: Smoke test packaged desktop app
        # The packaged app opens a real BrowserWindow, so the headless runner
        # needs a virtual display.
        run: xvfb-run -a pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only

      - name: Generate desktop version feed
        run: pnpm --dir apps/desktop run desktop:version-feed

      - name: Upload desktop workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-harness-desktop-linux-x64
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-linux.yml
            apps/desktop/release/desktop-version-linux.json
          if-no-files-found: error

  publish:
    name: Publish stable desktop release
    needs:
      - macos
      - linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The plan runs before the downloads: a qa or publish=false run has no use
      # for several hundred MB of binaries it will never upload.
      - name: Plan release publication
        id: release_plan
        env:
          HAS_SIGNING_SECRETS: ${{ needs.macos.outputs.has_signing_secrets }}
          INPUT_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'stable' || inputs.release_channel }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          BB_APP_VERSION="$(node -p "require('./packages/bb-app/package.json').version")"
          if [[ "$VERSION" != "$BB_APP_VERSION" ]]; then
            echo "::error::Desktop version ${VERSION} does not match bb-app version ${BB_APP_VERSION}."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" || "$INPUT_PUBLISH" == "true" ]]; then
            git fetch --no-tags origin main
            MAIN_SHA="$(git rev-parse origin/main)"
            if [[ "${GITHUB_SHA}" != "$MAIN_SHA" ]]; then
              echo "::error::Stable releases must target the current protected main commit ${MAIN_SHA}; got ${GITHUB_SHA}."
              exit 1
            fi
          fi

          EXPECTED_TAG="marketing-harness-v${VERSION}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "$EXPECTED_TAG" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match desktop package version ${VERSION}; expected ${EXPECTED_TAG}."
            exit 1
          fi
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          SHOULD_PUBLISH="false"
          if [[ "$INPUT_PUBLISH" == "true" && "$RELEASE_CHANNEL" == "stable" && "$IS_PRERELEASE" == "false" ]]; then
            SHOULD_PUBLISH="true"
          fi

          # Linux AppImages have no notarization equivalent, so they publish on
          # their own. Only the macOS binaries wait on the Apple secrets.
          PUBLISH_MACOS_BINARIES="false"
          if [[ "$HAS_SIGNING_SECRETS" == "true" ]]; then
            PUBLISH_MACOS_BINARIES="true"
          elif [[ "$SHOULD_PUBLISH" == "true" ]]; then
            echo "::warning::macOS signing/notarization secrets are missing; publishing the version feeds and Linux AppImage only, and withholding unsigned .dmg/.zip artifacts."
          fi

          {
            echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "should_publish=$SHOULD_PUBLISH"
            echo "publish_macos_binaries=$PUBLISH_MACOS_BINARIES"
          } >> "$GITHUB_OUTPUT"

      - name: Download arm64 macOS desktop artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketing-harness-desktop-macos-arm64
          path: release/macos/arm64

      - name: Download x64 macOS desktop artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketing-harness-desktop-macos-x64
          path: release/macos/x64

      - name: Download Linux desktop artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketing-harness-desktop-linux-x64
          path: release/linux

      - name: Merge macOS architecture artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        env:
          BB_DESKTOP_RELEASE_CHANNEL: latest
        run: |
          node apps/desktop/scripts/merge-macos-release-artifacts.mjs \
            release/macos/arm64 \
            release/macos/x64 \
            release/macos/combined

      - name: Publish stable desktop release feed
        if: steps.release_plan.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_plan.outputs.version }}
          PUBLISH_MACOS_BINARIES: ${{ steps.release_plan.outputs.publish_macos_binaries }}
        run: |
          set -euo pipefail

          VERSION_TAG="marketing-harness-v${VERSION}"
          LATEST_TAG="marketing-harness-latest"
          MACOS_DIR="release/macos/combined"
          LINUX_DIR="release/linux"

          RELEASE_ASSETS=()

          # An unmatched glob would otherwise reach gh as a literal pattern and
          # fail the upload, so each expansion states whether it is required.
          add_required_glob() {
            local matches=("$@")
            if [[ ! -e "${matches[0]}" ]]; then
              echo "::error::No release artifact matched ${matches[0]}."
              exit 1
            fi
            RELEASE_ASSETS+=("${matches[@]}")
          }

          add_optional_glob() {
            local matches=("$@")
            if [[ -e "${matches[0]}" ]]; then
              RELEASE_ASSETS+=("${matches[@]}")
            fi
          }

          # Both platforms reset the same moving release, so a single job
          # assembles every asset. Splitting the reset across platform jobs
          # would let whichever finished last delete the other's binaries.
          # Upload binaries before their metadata so clients never observe a
          # feed that points at an asset which has not finished uploading.
          add_required_glob "$LINUX_DIR"/*.AppImage
          # AppImage embeds its block map, so a sidecar file is not guaranteed.
          add_optional_glob "$LINUX_DIR"/*.blockmap

          if [[ "$PUBLISH_MACOS_BINARIES" == "true" ]]; then
            add_required_glob "$MACOS_DIR"/*.dmg
            add_required_glob "$MACOS_DIR"/*.zip
            add_required_glob "$MACOS_DIR"/*.blockmap
            add_required_glob "$MACOS_DIR/latest-mac.yml"
          else
            echo "Signing/notarization gate is closed; publishing the macOS version feed without macOS binaries."
          fi

          add_required_glob "$LINUX_DIR/latest-linux.yml"
          add_required_glob "$LINUX_DIR/desktop-version-linux.json"
          add_required_glob "$MACOS_DIR/desktop-version.json"

          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Release $VERSION_TAG already exists; repairing any partial asset upload from an earlier attempt."
            gh release upload "$VERSION_TAG" "${RELEASE_ASSETS[@]}" --clobber
          else
            gh release create "$VERSION_TAG" "${RELEASE_ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "marketing-harness desktop ${VERSION}" \
              --notes "marketing-harness desktop ${VERSION}" \
              --latest
          fi

          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            gh release edit "$LATEST_TAG" \
              --target "$GITHUB_SHA" \
              --title "marketing-harness desktop latest" \
              --notes "Latest stable marketing-harness desktop release metadata." \
              --latest=false

            # Upload and validate the new asset set before removing stale
            # versioned binaries. This preserves the previous working feed if
            # an upload fails midway.
            gh release upload "$LATEST_TAG" "${RELEASE_ASSETS[@]}" --clobber

            EXPECTED_ASSETS="$(printf '%s\n' "${RELEASE_ASSETS[@]}" | xargs -n1 basename)"
            gh release view "$LATEST_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset_name; do
              if [[ -n "$asset_name" ]] && ! grep -Fxq "$asset_name" <<< "$EXPECTED_ASSETS"; then
                gh release delete-asset "$LATEST_TAG" "$asset_name" --yes
              fi
            done
          else
            gh release create "$LATEST_TAG" "${RELEASE_ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "marketing-harness desktop latest" \
              --notes "Latest stable marketing-harness desktop release metadata." \
              --latest=false
          fi

          # Move the public pointer only after every release asset operation
          # succeeds, so a failed upload leaves the previous release intact.
          git tag -f "$LATEST_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/${LATEST_TAG}"

      - name: Summarize
        env:
          IS_PRERELEASE: ${{ steps.release_plan.outputs.is_prerelease }}
          PUBLISH_MACOS_BINARIES: ${{ steps.release_plan.outputs.publish_macos_binaries }}
          SHOULD_PUBLISH: ${{ steps.release_plan.outputs.should_publish }}
          VERSION: ${{ steps.release_plan.outputs.version }}
        run: |
          {
            echo "## marketing-harness desktop artifacts"
            echo
            echo "- arm64 and x64 macOS .dmg/.zip artifacts and per-architecture metadata uploaded in parallel workflow artifacts"
            echo "- x64 Linux .AppImage, latest-linux.yml, and desktop-version-linux.json uploaded as workflow artifacts"
            echo "- version: ${VERSION}"
            echo "- prerelease version: ${IS_PRERELEASE}"
            echo "- stable release publication requested and allowed: ${SHOULD_PUBLISH}"
            echo "- macOS release binary upload enabled: ${PUBLISH_MACOS_BINARIES}"
            echo "- macOS feed URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/marketing-harness-latest/desktop-version.json"
            echo "- Linux feed URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/marketing-harness-latest/desktop-version-linux.json"
          } >> "$GITHUB_STEP_SUMMARY"
